name: OpenWrt RAW client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v1.0.2)'
        required: false
      publish_release:
        description: 'Publish release (default: true)'
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  meta:
    name: Determine version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Read release tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref }}" | grep -q 'refs/tags/'; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "qWDTT tag: $TAG"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86
          - name: x86_64
            goarch: amd64
          - name: i386
            goarch: 386

          # ARM 64-bit
          - name: aarch64
            goarch: arm64

          # ARM 32-bit
          - name: armv7
            goarch: arm
            goarm: "7"
          - name: armv6
            goarch: arm
            goarm: "6"
          - name: armv5
            goarch: arm
            goarm: "5"

          # MIPS Little-Endian (MediaTek MT7621, MT7628, MT7620, etc.)
          - name: mipsel
            goarch: mipsle
            gomips: softfloat
          - name: mipsel_hardfloat
            goarch: mipsle
            gomips: hardfloat

          # MIPS Big-Endian (Atheros ath79, AR7xxx, AR9xxx, Realtek, etc.)
          - name: mips
            goarch: mips
            gomips: softfloat
          - name: mips_hardfloat
            goarch: mips
            gomips: hardfloat

          # MIPS64 (Cavium Octeon EdgeRouter, etc.)
          - name: mips64
            goarch: mips64
          - name: mips64el
            goarch: mips64le

          # RISC-V 64-bit
          - name: riscv64
            goarch: riscv64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: client/go.sum

      - name: Build static client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../qwdtt-client .

      - name: Pack archive
        run: |
          tar -czf "qwdtt-openwrt-${{ matrix.name }}.tar.gz" qwdtt-client install.sh files README.md LICENSE
          sha256sum "qwdtt-openwrt-${{ matrix.name }}.tar.gz" > "qwdtt-openwrt-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwdtt-openwrt-${{ matrix.name }}
          path: |
            qwdtt-openwrt-${{ matrix.name }}.tar.gz
            qwdtt-openwrt-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    needs: [meta, build]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: qwdtt-openwrt-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cat *.sha256 > sha256sums.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          gh release create "${TAG}" ./*.tar.gz sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "qWDTT OpenWrt ${TAG}" \
            --generate-notes || \
          gh release upload "${TAG}" ./*.tar.gz sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
