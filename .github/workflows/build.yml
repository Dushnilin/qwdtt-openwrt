name: OpenWrt RAW client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v1.0.3)'
        required: false
      publish_release:
        description: 'Publish release (default: true)'
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  meta:
    name: Determine version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Read release tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref }}" | grep -q 'refs/tags/'; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.3")
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "qWDTT tag: $TAG, version: $VER"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86
          - name: x86_64
            goarch: amd64
            ipk_arches: "x86_64"
            apk_arches: "x86_64"

          - name: i386
            goarch: 386
            ipk_arches: "i386_pentium4 i386"
            apk_arches: "x86 i386"

          # ARM 64-bit
          - name: aarch64
            goarch: arm64
            ipk_arches: "aarch64_generic aarch64_cortex-a53 aarch64"
            apk_arches: "aarch64 aarch64_generic aarch64_cortex-a53"

          # ARM 32-bit
          - name: armv7
            goarch: arm
            goarm: "7"
            ipk_arches: "arm_cortex-a7_neon-vfpv4 arm_cortex-a9 arm_cortex-a15_neon-vfpv4 armv7"
            apk_arches: "armv7"

          - name: armv6
            goarch: arm
            goarm: "6"
            ipk_arches: "arm_arm1176jzf-s_vfp armv6"
            apk_arches: "armhf armv6"

          - name: armv5
            goarch: arm
            goarm: "5"
            ipk_arches: "arm_arm926ej-s armv5"
            apk_arches: "armel armv5"

          # MIPS Little-Endian (MediaTek MT7621, MT7628, MT7620, etc.)
          - name: mipsel
            goarch: mipsle
            gomips: softfloat
            ipk_arches: "mipsel_24kc mipsel"
            apk_arches: "mipsel"

          - name: mipsel_hardfloat
            goarch: mipsle
            gomips: hardfloat
            ipk_arches: "mipsel_24kf mipsel_hardfloat"
            apk_arches: "mipselhf mipsel_hardfloat"

          # MIPS Big-Endian (Atheros ath79, AR7xxx, AR9xxx, Realtek, etc.)
          - name: mips
            goarch: mips
            gomips: softfloat
            ipk_arches: "mips_24kc mips"
            apk_arches: "mips"

          - name: mips_hardfloat
            goarch: mips
            gomips: hardfloat
            ipk_arches: "mips_24kf mips_hardfloat"
            apk_arches: "mipshf mips_hardfloat"

          # MIPS64 (Cavium Octeon EdgeRouter, etc.)
          - name: mips64
            goarch: mips64
            ipk_arches: "mips64"
            apk_arches: "mips64"

          - name: mips64el
            goarch: mips64le
            ipk_arches: "mips64el"
            apk_arches: "mips64el"

          # RISC-V 64-bit
          - name: riscv64
            goarch: riscv64
            ipk_arches: "riscv64_generic riscv64"
            apk_arches: "riscv64"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: client/go.sum

      - name: Install packaging tools
        run: |
          sudo curl -fsSL https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.0/x86_64/apk.static -o /usr/local/bin/apk.static
          sudo chmod +x /usr/local/bin/apk.static
          sudo curl -fsSL https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -o /usr/local/bin/ipkg-build
          sudo chmod +x /usr/local/bin/ipkg-build

      - name: Build static client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../qwdtt-client .

      - name: Pack packages
        run: bash scripts/build_packages.sh "${{ matrix.name }}" "${{ matrix.ipk_arches }}" "${{ matrix.apk_arches }}" "${{ needs.meta.outputs.tag }}" "${{ needs.meta.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwdtt-openwrt-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    needs: [meta, build]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: qwdtt-openwrt-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cat *.sha256 | sort -u > sha256sums.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          gh release create "${TAG}" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "qWDTT OpenWrt ${TAG}" \
            --generate-notes || \
          gh release upload "${TAG}" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
