name: OpenWrt RAW client

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v1.0.3)'
        required: false
      publish_release:
        description: 'Publish release (default: true)'
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  meta:
    name: Determine version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Read release tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && echo "${{ github.ref }}" | grep -q 'refs/tags/'; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.3")
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "qWDTT tag: $TAG, version: $VER"

  build-clients:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86
          - name: x86_64
            goarch: amd64
          - name: i386
            goarch: 386

          # ARM 64-bit
          - name: aarch64
            goarch: arm64

          # ARM 32-bit
          - name: armv7
            goarch: arm
            goarm: "7"
          - name: armv6
            goarch: arm
            goarm: "6"
          - name: armv5
            goarch: arm
            goarm: "5"

          # MIPS Little-Endian (MediaTek MT7621, MT7628, MT7620, etc.)
          - name: mipsel
            goarch: mipsle
            gomips: softfloat
          - name: mipsel_hardfloat
            goarch: mipsle
            gomips: hardfloat

          # MIPS Big-Endian (Atheros ath79, AR7xxx, AR9xxx, Realtek, etc.)
          - name: mips
            goarch: mips
            gomips: softfloat
          - name: mips_hardfloat
            goarch: mips
            gomips: hardfloat

          # MIPS64 (Cavium Octeon EdgeRouter, etc.)
          - name: mips64
            goarch: mips64
          - name: mips64el
            goarch: mips64le

          # RISC-V 64-bit
          - name: riscv64
            goarch: riscv64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: client/go.sum

      - name: Build static client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o "../qwdtt-client-${{ matrix.name }}" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: qwdtt-bin-${{ matrix.name }}
          path: qwdtt-client-${{ matrix.name }}
          retention-days: 1

  package-and-release:
    name: Package and publish release
    needs: [meta, build-clients]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all compiled binaries
        uses: actions/download-artifact@v4
        with:
          pattern: qwdtt-bin-*
          merge-multiple: true
          path: bin

      - name: Cache OpenWrt host tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/.openwrt-tools
          key: openwrt-host-tools-25.12.3-v3

      - name: Setup OpenWrt host tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.openwrt-tools/bin ~/.openwrt-tools/lib
          curl -fsSL https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst -o /tmp/openwrt-sdk.tar.zst
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst --wildcards '*/staging_dir/host/bin/apk' '*/staging_dir/host/lib/*' '*/scripts/ipkg-build'
          cp -p $(find . -path '*/staging_dir/host/bin/apk' | head -n 1) ~/.openwrt-tools/bin/apk.bin
          cp -p $(find . -path '*/scripts/ipkg-build' | head -n 1) ~/.openwrt-tools/bin/ipkg-build
          HOST_LIB="$(find . -path '*/staging_dir/host/lib' -type d | head -n 1)"
          if [ -n "$HOST_LIB" ]; then
            cp -a "$HOST_LIB/." ~/.openwrt-tools/lib/ 2>/dev/null || true
            rm -f ~/.openwrt-tools/lib/libc.* ~/.openwrt-tools/lib/libm.* ~/.openwrt-tools/lib/libpthread.* ~/.openwrt-tools/lib/libdl.* ~/.openwrt-tools/lib/librt.* ~/.openwrt-tools/lib/ld-*
          fi
          printf '#!/bin/sh\nLD_LIBRARY_PATH="/home/runner/.openwrt-tools/lib:${LD_LIBRARY_PATH:-}" exec /home/runner/.openwrt-tools/bin/apk.bin "$@"' > ~/.openwrt-tools/bin/apk
          printf '\n' >> ~/.openwrt-tools/bin/apk
          chmod +x ~/.openwrt-tools/bin/apk ~/.openwrt-tools/bin/apk.bin ~/.openwrt-tools/bin/ipkg-build
          rm -f /tmp/openwrt-sdk.tar.zst
          echo "=== Testing apk ==="
          ~/.openwrt-tools/bin/apk --version || ~/.openwrt-tools/bin/apk version || true
          echo "=== Testing ipkg-build ==="
          ~/.openwrt-tools/bin/ipkg-build -h || true

      - name: Ensure tool permissions
        run: |
          chmod +x ~/.openwrt-tools/bin/* 2>/dev/null || true

      - name: Build all packages
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
          APK_BIN: /home/runner/.openwrt-tools/bin/apk
          IPKG_BUILD_BIN: /home/runner/.openwrt-tools/bin/ipkg-build
        run: |
          chmod +x scripts/build_all_packages.sh
          bash scripts/build_all_packages.sh "$TAG" "$VER"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          cd dist
          gh release create "${TAG}" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "qWDTT OpenWrt ${TAG}" \
            --generate-notes || \
          gh release upload "${TAG}" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
